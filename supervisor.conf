; supervisor.conf — process management for chrome_stalker
; Start everything with: start.bat
; Manual control: supervisorctl -c supervisor.conf <command>

[supervisord]
logfile=%(here)s/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=5
loglevel=info
pidfile=%(here)s/supervisord.pid
nodaemon=false

[inet_http_server]
port=127.0.0.1:9001

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:stalker]
command=python %(here)s/stalker.py
directory=%(here)s
autostart=true
autorestart=true
stdout_logfile=%(here)s/logs/stalker.log
stderr_logfile=%(here)s/logs/stalker.err.log

[program:tbot]
command=python %(here)s/tBotAgent.py
directory=%(here)s
autostart=true
autorestart=true
stdout_logfile=%(here)s/logs/tbot.log
stderr_logfile=%(here)s/logs/tbot.err.log
